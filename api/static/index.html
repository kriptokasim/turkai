<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Turkai UI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f111a;
        --panel: #161925;
        --text: #e7ecff;
        --accent: #3b82f6;
        --border: #273043;
        --user: #20283a;
        --assistant: #182232;
      }
      body {
        margin: 0;
        font-family: system-ui, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        min-height: 100vh;
        justify-content: center;
      }
      .app { width: min(960px, 100%); padding: 24px; box-sizing: border-box; }
      header {
        display: flex; align-items: center; justify-content: space-between;
        margin-bottom: 16px; gap: 12px; flex-wrap: wrap;
      }
      header h1 { margin: 0; font-size: 1.5rem; }
      .header-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
      .conversation {
        border: 1px solid var(--border); border-radius: 12px; background: var(--panel);
        padding: 16px; height: 55vh; overflow-y: auto; display: flex; flex-direction: column;
        gap: 12px; margin-bottom: 16px;
      }
      .bubble { border-radius: 10px; padding: 12px 14px; white-space: pre-wrap; line-height: 1.45; }
      .bubble.user { background: var(--user); align-self: flex-end; }
      .bubble.assistant { background: var(--assistant); border-left: 3px solid var(--accent); }
      textarea, input {
        width: 100%; box-sizing: border-box; border-radius: 10px; border: 1px solid var(--border);
        background: rgb(9 11 18 / 60%); color: var(--text); padding: 12px; font-size: 1rem;
        font-family: inherit; resize: vertical;
      }
      textarea:focus, input:focus { outline: 2px solid var(--accent); }
      .controls { display: flex; gap: 12px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
      button {
        border: none; border-radius: 8px; padding: 12px 18px; font-size: 1rem; cursor: pointer;
        background: var(--accent); color: white; transition: transform 0.1s ease, opacity 0.1s ease;
      }
      button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
      button:disabled { opacity: 0.6; cursor: progress; }
      .status { font-size: 0.9rem; color: #9aa6d7; min-height: 1.2em; }
      .kv { display: grid; grid-template-columns: 130px 1fr; gap: 8px 12px; align-items: center; }
      .row { display: contents; }
      .pill { padding: 6px 10px; border: 1px solid var(--border); border-radius: 999px; }
      @media (max-width: 640px) {
        .conversation { height: 50vh; }
        .controls { flex-direction: column; align-items: stretch; }
        button, .controls button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <h1>Turkai Local Assistant</h1>
        <div class="header-actions">
          <span class="status" id="sessionInfo"></span>
          <button class="secondary" id="resetBtn">New chat</button>
          <button class="secondary" id="closeBtn">Close</button>
        </div>
      </header>

      <section class="kv" style="margin-bottom:12px;">
        <div class="row">
          <label for="apiKey">X-API-Key</label>
          <input id="apiKey" placeholder="(optional)" />
        </div>
        <div class="row">
          <span></span>
          <button class="secondary" id="saveKeyBtn">Save key</button>
        </div>
      </section>

      <label>
        System prompt (first request only)
        <textarea id="systemPrompt" rows="2">You are a precise coding assistant.</textarea>
      </label>

      <div class="conversation" id="conversation"></div>

      <!-- Agent Loop panel -->
      <section style="border:1px solid var(--border);border-radius:12px;background:var(--panel);padding:12px;margin:16px 0;">
        <label>
          Agent goal
          <textarea id="agentGoal" rows="3"
            placeholder='Read demo/hello.py, run it with python3, write stdout to demo/output.txt, then finish.'></textarea>
        </label>
        <div class="controls">
          <button class="secondary" id="agentRunBtn">Run Agent</button>
          <span class="status" id="agentStatus"></span>
        </div>
      </section>

      <label>
        Ask Turkai
        <textarea id="userInput" rows="3" placeholder="Write a Python function that..."></textarea>
      </label>

      <div class="controls">
        <button id="sendBtn">Send</button>
        <button class="secondary" id="pytestBtn" title="pytest -q">Run tests</button>
        <span class="status" id="status"></span>
      </div>
    </div>

    <script>
      const apiUrl = "/chat";
      const execPytestUrl = "/exec/pytest";
      const agentLoopUrl = "/agent/loop";

      const conversationEl = document.getElementById("conversation");
      const userInputEl = document.getElementById("userInput");
      const systemPromptEl = document.getElementById("systemPrompt");
      const sendBtn = document.getElementById("sendBtn");
      const resetBtn = document.getElementById("resetBtn");
      const closeBtn = document.getElementById("closeBtn");
      const statusEl = document.getElementById("status");
      const sessionInfoEl = document.getElementById("sessionInfo");
      const pytestBtn = document.getElementById("pytestBtn");

      const agentRunBtn = document.getElementById("agentRunBtn");
      const agentGoalEl = document.getElementById("agentGoal");
      const agentStatusEl = document.getElementById("agentStatus");

      const apiKeyInput = document.getElementById("apiKey");
      const saveKeyBtn = document.getElementById("saveKeyBtn");

      let sessionId = null;
      let API_KEY = localStorage.getItem("turkai_api_key") || "";
      apiKeyInput.value = API_KEY;

      function addBubble(role, text) {
        const bubble = document.createElement("div");
        bubble.className = `bubble ${role}`;
        bubble.textContent = text;
        conversationEl.appendChild(bubble);
        conversationEl.scrollTop = conversationEl.scrollHeight;
      }

      function setLoading(isLoading) {
        sendBtn.disabled = isLoading;
        userInputEl.disabled = isLoading;
        statusEl.textContent = isLoading ? "Thinking..." : "";
      }

      function setAgentLoading(isLoading) {
        agentRunBtn.disabled = isLoading;
        agentGoalEl.disabled = isLoading;
        agentStatusEl.textContent = isLoading ? "Running agent..." : "";
      }

      function updateSessionInfo() {
        sessionInfoEl.textContent = sessionId ? `Session: ${sessionId}` : "";
      }

      saveKeyBtn.addEventListener("click", () => {
        API_KEY = apiKeyInput.value.trim();
        localStorage.setItem("turkai_api_key", API_KEY);
        addBubble("assistant", API_KEY ? "API key saved." : "API key cleared.");
      });

      async function sendMessage() {
        const userMessage = userInputEl.value.trim();
        if (!userMessage) return;

        const messages = [];
        if (!sessionId) {
          const systemMessage = systemPromptEl.value.trim();
          if (systemMessage) messages.push({ role: "system", content: systemMessage });
        }
        messages.push({ role: "user", content: userMessage });

        addBubble("user", userMessage);
        userInputEl.value = "";

        setLoading(true);
        try {
          const headers = { "Content-Type": "application/json" };
          // /chat şu an authsuz; gerekirse buraya ekleyebilirsin:
          // if (API_KEY) headers["X-API-Key"] = API_KEY;

          const response = await fetch(apiUrl, {
            method: "POST",
            headers,
            body: JSON.stringify({
              session_id: sessionId,
              messages,
              options: {},
            }),
          });

          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          sessionId = data.session_id || sessionId;
          updateSessionInfo();
          addBubble("assistant", data.answer || "[no answer]");
        } catch (error) {
          addBubble("assistant", `[error] ${error.message}`);
        } finally {
          setLoading(false);
          userInputEl.focus();
        }
      }

      async function runPytests() {
        setLoading(true);
        try {
          const headers = {
            "Content-Type": "application/json",
          };
          if (API_KEY) headers["X-API-Key"] = API_KEY;

          const response = await fetch(execPytestUrl, {
            method: "POST",
            headers,
            body: JSON.stringify({ extra: "-q", cwd: "." }),
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          const out =
            `pytest exit=${data.exit_code}\n` +
            (data.stdout || "") +
            (data.stderr ? `\n[stderr]\n${data.stderr}` : "");
          addBubble("assistant", out.trim() || "[no output]");
        } catch (e) {
          addBubble("assistant", `[exec error] ${e.message}`);
        } finally {
          setLoading(false);
        }
      }

      async function runAgent() {
        const goal = agentGoalEl.value.trim();
        if (!goal) {
          addBubble("assistant", "[agent] Please enter a goal first.");
          return;
        }
        setAgentLoading(true);
        try {
          const headers = { "Content-Type": "application/json" };
          if (API_KEY) headers["X-API-Key"] = API_KEY;

          const resp = await fetch(agentLoopUrl, {
            method: "POST",
            headers,
            body: JSON.stringify({ goal, max_steps: 5 })
          });
          if (!resp.ok) throw new Error(`HTTP ${resp.status}`);
          const data = await resp.json();
          const lines = [];
          lines.push(`Agent session: ${data.session_id || "-"}`);
          (data.steps || []).forEach(s => {
            lines.push(`\n# Step ${s.step} — ${s.action}`);
            if (s.args) lines.push(`args: ${JSON.stringify(s.args)}`);
            if (s.error) {
              lines.push(`error: ${s.error}`);
            } else if (s.observation != null) {
              const obs = typeof s.observation === 'string'
                ? s.observation
                : JSON.stringify(s.observation, null, 2);
              lines.push(`observation:\n${obs}`);
            }
          });
          if (data.done) {
            const res = (typeof data.result === 'string' ? data.result : JSON.stringify(data.result));
            lines.push(`\n[done] result: ${res}`);
          }
          addBubble("assistant", lines.join("\n"));
        } catch (e) {
          addBubble("assistant", `[agent error] ${e.message}`);
        } finally {
          setAgentLoading(false);
        }
      }

      function resetConversation() {
        sessionId = null;
        conversationEl.textContent = "";
        statusEl.textContent = "Session reset.";
        userInputEl.disabled = false;
        sendBtn.disabled = false;
        closeBtn.disabled = false;
        updateSessionInfo();
        systemPromptEl.focus();
      }

      function closeConversation() {
        if (!sessionId) {
          sessionInfoEl.textContent = "No active session.";
          return;
        }
        const hint = `Session closed: ${sessionId}\nResume later with:\n  turkai resume ${sessionId}`;
        addBubble("assistant", hint);
        statusEl.textContent = "Session closed.";
        sessionInfoEl.textContent = `Session closed: ${sessionId}`;
        userInputEl.disabled = true;
        sendBtn.disabled = true;
        closeBtn.disabled = true;
      }

      sendBtn.addEventListener("click", sendMessage);
      pytestBtn.addEventListener("click", runPytests);
      agentRunBtn.addEventListener("click", runAgent);
      resetBtn.addEventListener("click", resetConversation);
      closeBtn.addEventListener("click", closeConversation);
      userInputEl.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          sendMessage();
        }
      });
      updateSessionInfo();
    </script>
  </body>
</html>
