<!DOCTYPE html>
<html lang="tr">
  <head>
    <meta charset="utf-8" />
    <title>Turkai UI</title>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <style>
      :root {
        color-scheme: light dark;
        --bg: #0f111a;
        --panel: #161925;
        --text: #e7ecff;
        --accent: #3b82f6;
        --border: #273043;
        --user: #20283a;
        --assistant: #182232;
      }
      body {
        margin: 0;
        font-family: system-ui, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        display: flex;
        min-height: 100vh;
        justify-content: center;
      }
      .app { width: min(960px, 100%); padding: 24px; box-sizing: border-box; }
      header {
        display: flex; align-items: center; justify-content: space-between;
        margin-bottom: 16px; gap: 12px; flex-wrap: wrap;
      }
      header h1 { margin: 0; font-size: 1.5rem; }
      .header-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
      .conversation {
        border: 1px solid var(--border); border-radius: 12px; background: var(--panel);
        padding: 16px; height: 55vh; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; margin-bottom: 16px;
      }
      .bubble { border-radius: 10px; padding: 12px 14px; white-space: pre-wrap; line-height: 1.45; }
      .bubble.user { background: var(--user); align-self: flex-end; }
      .bubble.assistant { background: var(--assistant); border-left: 3px solid var(--accent); }
      textarea, input {
        width: 100%; box-sizing: border-box; border-radius: 10px;
        border: 1px solid var(--border); background: rgb(9 11 18 / 60%);
        color: var(--text); padding: 12px; font-size: 1rem; font-family: inherit; resize: vertical;
      }
      textarea:focus, input:focus { outline: 2px solid var(--accent); }
      .controls { display: flex; gap: 12px; margin-top: 12px; align-items: center; flex-wrap: wrap; }
      button {
        border: none; border-radius: 8px; padding: 10px 14px; font-size: .95rem; cursor: pointer;
        background: var(--accent); color: white; transition: transform .1s ease, opacity .1s ease;
      }
      button.secondary { background: transparent; border: 1px solid var(--border); color: var(--text); }
      button:disabled { opacity: 0.6; cursor: progress; }
      .status { font-size: 0.9rem; color: #9aa6d7; min-height: 1.2em; }
      .shortcut-bar { display:flex; gap:8px; flex-wrap:wrap; margin:8px 0 16px; }
      @media (max-width: 640px) {
        .conversation { height: 50vh; }
        .controls { flex-direction: column; align-items: stretch; }
        button, .controls button { width: 100%; }
      }
    </style>
  </head>
  <body>
    <div class="app">
      <header>
        <h1>Turkai Local Assistant</h1>
        <div class="header-actions">
          <span class="status" id="sessionInfo"></span>
          <button class="secondary" id="resetBtn">Yeni sohbet</button>
          <button class="secondary" id="closeBtn">Kapat</button>
        </div>
      </header>

      <label>
        System prompt (ilk istek için)
        <textarea id="systemPrompt" rows="2">You are Turkai, a local coding assistant with direct access to the project repository. Use the context/snippet/search/diff helpers and request agent actions when edits or tests are required. Think step by step and describe intended changes before executing them.</textarea>
      </label>

      <div class="shortcut-bar">
        <button class="secondary" id="btnWS">WS ile gönder</button>
        <button class="secondary" id="btnReadme">README özetle (agent)</button>
        <button class="secondary" id="btnFormat">Format (black)</button>
        <button class="secondary" id="btnPytest">Run tests</button>
        <button class="secondary" id="btnTree">Tree</button>
        <button class="secondary" id="btnSnippet">Snippet</button>
        <button class="secondary" id="btnSearch">Search</button>
        <button class="secondary" id="btnDiff">Diff</button>
      </div>

      <div class="conversation" id="conversation"></div>

      <label>
        Mesajın
        <textarea id="userInput" rows="3" placeholder="Write a Python function that..."></textarea>
      </label>

      <div class="controls">
        <button id="sendBtn">Gönder /chat</button>
        <span class="status" id="status"></span>
      </div>
    </div>

    <script>
      const api = {
        chat: "/chat",
        stream: "/chat/stream",
        ws: (host) => `ws://${host}/ws/chat`,
        agent: "/agent/step",
      };
      const conversationEl = document.getElementById("conversation");
      const userInputEl = document.getElementById("userInput");
      const systemPromptEl = document.getElementById("systemPrompt");
      const sendBtn = document.getElementById("sendBtn");
      const resetBtn = document.getElementById("resetBtn");
      const closeBtn = document.getElementById("closeBtn");
      const statusEl = document.getElementById("status");
      const sessionInfoEl = document.getElementById("sessionInfo");

      const btnWS = document.getElementById("btnWS");
      const btnReadme = document.getElementById("btnReadme");
      const btnFormat = document.getElementById("btnFormat");
      const btnPytest = document.getElementById("btnPytest");
      const btnTree = document.getElementById("btnTree");
      const btnSnippet = document.getElementById("btnSnippet");
      const btnSearch = document.getElementById("btnSearch");
      const btnDiff = document.getElementById("btnDiff");

      let sessionId = null;
      const params = new URLSearchParams(window.location.search);
      const initialSession = params.get("session_id") || params.get("session");
      const API_KEY = ""; // eğer app için API_KEY ayarladıysan, fetch header'ına ekle

      function addBubble(role, text) {
        const bubble = document.createElement("div");
        bubble.className = `bubble ${role}`;
        bubble.textContent = text;
        conversationEl.appendChild(bubble);
        conversationEl.scrollTop = conversationEl.scrollHeight;
      }

      function setLoading(isLoading) {
        sendBtn.disabled = isLoading;
        userInputEl.disabled = isLoading;
        statusEl.textContent = isLoading ? "Thinking..." : "";
      }

      function updateSessionInfo() {
        sessionInfoEl.textContent = sessionId ? `Session: ${sessionId}` : "";
      }

      async function loadSessionHistory(seedId) {
        try {
          const res = await fetch(`/resume?session_id=${encodeURIComponent(seedId)}`);
          if (!res.ok) return;
          const data = await res.json();
          const msgs = (data.messages || []).filter((m) => m.role && m.content);
          conversationEl.textContent = "";
          msgs.forEach((m) => addBubble(m.role, m.content));
          sessionId = seedId;
          updateSessionInfo();
        } catch (error) {
          console.error("loadSessionHistory", error);
        }
      }

      async function sendMessage() {
        const userMessage = userInputEl.value.trim();
        if (!userMessage) return;

        const messages = [];
        if (!sessionId) {
          const systemMessage = systemPromptEl.value.trim();
          if (systemMessage) messages.push({ role: "system", content: systemMessage });
        }
        messages.push({ role: "user", content: userMessage });

        addBubble("user", userMessage);
        userInputEl.value = "";

        setLoading(true);
        try {
          const response = await fetch(api.chat, {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              ...(API_KEY ? { "X-API-Key": API_KEY } : {}),
            },
            body: JSON.stringify({
              session_id: sessionId,
              messages,
              options: {},
            }),
          });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);
          const data = await response.json();
          sessionId = data.session_id || sessionId;
          updateSessionInfo();
          addBubble("assistant", data.answer || "[no answer]");
        } catch (error) {
          addBubble("assistant", `[error] ${error.message}`);
        } finally {
          setLoading(false);
          userInputEl.focus();
        }
      }

      // WebSocket kısa yol
      btnWS.addEventListener("click", () => {
        const ws = new WebSocket(api.ws(location.host));
        ws.onopen = () => {
          const msgs = [{ role: "user", content: userInputEl.value || "Hello via WS" }];
          ws.send(JSON.stringify({ messages: msgs }));
        };
        ws.onmessage = (ev) => addBubble("assistant", ev.data);
        ws.onerror = () => addBubble("assistant", "WS error");
      });

      // /agent/step kısa yol
      async function agentStep(msgs, allow, cwd=".") {
        const r = await fetch(api.agent, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            ...(API_KEY ? { "X-API-Key": API_KEY } : {}),
          },
          body: JSON.stringify({ messages: msgs, allow, cwd }),
        });
        return r.json();
      }

      btnReadme.addEventListener("click", async () => {
        const msgs = [
          { role: "system", content: "Return JSON only." },
          { role: "user", content: "Read README.md then FINAL a one sentence summary." }
        ];
        const res = await agentStep(msgs, ["fs.read"]);
        addBubble("assistant", JSON.stringify(res, null, 2));
      });

      btnFormat.addEventListener("click", async () => {
        const msgs = [
          { role: "user", content: "Run black on api/app.py; if black not found, FINAL with an instruction." }
        ];
        const res = await agentStep(msgs, ["exec.run"]);
        addBubble("assistant", JSON.stringify(res, null, 2));
      });

      btnPytest.addEventListener("click", async () => {
        const msgs = [{ role: "user", content: "Execute: pytest -q. Return stdout." }];
        const res = await agentStep(msgs, ["exec.run"]);
        addBubble("assistant", JSON.stringify(res, null, 2));
      });

      btnTree.addEventListener("click", async () => {
        const base = prompt("Tree root (relative to repo)", ".") ?? ".";
        const depth = parseInt(prompt("Max depth", "2") ?? "2", 10);
        const maxEntries = parseInt(prompt("Max entries", "200") ?? "200", 10);
        try {
          const res = await fetch("/context/tree", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              ...(API_KEY ? { "X-API-Key": API_KEY } : {}),
            },
            body: JSON.stringify({ path: base, max_depth: depth, max_entries: maxEntries }),
          });
          const data = await res.json();
          addBubble("assistant", JSON.stringify(data, null, 2));
        } catch (error) {
          addBubble("assistant", `[tree error] ${error.message}`);
        }
      });

      btnSnippet.addEventListener("click", async () => {
        const path = prompt("File path", "api/app.py");
        if (!path) return;
        const line = parseInt(prompt("Line", "1") ?? "1", 10);
        const context = parseInt(prompt("Context lines", "8") ?? "8", 10);
        try {
          const res = await fetch("/context/snippet", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              ...(API_KEY ? { "X-API-Key": API_KEY } : {}),
            },
            body: JSON.stringify({ path, line, context }),
          });
          const data = await res.json();
          if (data.snippet) {
            addBubble(
              "assistant",
              `${data.path}:${data.start_line}-${data.end_line}\n${data.snippet}`
            );
          } else {
            addBubble("assistant", JSON.stringify(data, null, 2));
          }
        } catch (error) {
          addBubble("assistant", `[snippet error] ${error.message}`);
        }
      });

      btnSearch.addEventListener("click", async () => {
        const pattern = prompt("Regex pattern", "class ");
        if (!pattern) return;
        const base = prompt("Search root", ".") ?? ".";
        const caseSensitive = confirm("Case sensitive search?");
        try {
          const res = await fetch("/fs/search", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              ...(API_KEY ? { "X-API-Key": API_KEY } : {}),
            },
            body: JSON.stringify({
              pattern,
              path: base,
              case_sensitive: caseSensitive,
            }),
          });
          const data = await res.json();
          if (!data.matches.length) {
            addBubble("assistant", "[search] no matches");
            return;
          }
          const out = data.matches
            .map((m) => `${m.path}:${m.line} ${m.preview}`)
            .join("\n");
          addBubble("assistant", out);
        } catch (error) {
          addBubble("assistant", `[search error] ${error.message}`);
        }
      });

      btnDiff.addEventListener("click", async () => {
        const rawPaths = prompt("Diff paths (space separated)", "") || "";
        const staged = confirm("Include staged changes?");
        const unified = parseInt(prompt("Unified context", "3") ?? "3", 10);
        const paths = rawPaths.trim() ? rawPaths.trim().split(/\s+/) : [];
        try {
          const res = await fetch("/context/diff", {
            method: "POST",
            headers: {
              "Content-Type": "application/json",
              ...(API_KEY ? { "X-API-Key": API_KEY } : {}),
            },
            body: JSON.stringify({ paths, staged, unified }),
          });
          if (!res.ok) {
            addBubble("assistant", `[diff error] ${res.status}`);
            return;
          }
          const data = await res.json();
          addBubble("assistant", data.diff || "[no diff]");
        } catch (error) {
          addBubble("assistant", `[diff error] ${error.message}`);
        }
      });

      function resetConversation() {
        sessionId = null;
        conversationEl.textContent = "";
        statusEl.textContent = "Session reset.";
        userInputEl.disabled = false;
        sendBtn.disabled = false;
        closeBtn.disabled = false;
        updateSessionInfo();
        systemPromptEl.focus();
      }

      function closeConversation() {
        if (!sessionId) {
          sessionInfoEl.textContent = "No active session.";
          return;
        }
        const hint = `Session closed: ${sessionId}\nResume later with:\n  turkai resume ${sessionId}`;
        addBubble("assistant", hint);
        statusEl.textContent = "Session closed.";
        sessionInfoEl.textContent = `Session closed: ${sessionId}`;
        userInputEl.disabled = true;
        sendBtn.disabled = true;
        closeBtn.disabled = true;
      }

      sendBtn.addEventListener("click", sendMessage);
      resetBtn.addEventListener("click", resetConversation);
      closeBtn.addEventListener("click", closeConversation);
      userInputEl.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          sendMessage();
        }
      });
      updateSessionInfo();
      if (initialSession) {
        loadSessionHistory(initialSession);
      }
    </script>
  </body>
</html>
